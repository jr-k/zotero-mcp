name: zotero-mcp

services:
  zotero-mcp:
    image: "${ZOTERO_MCP_IMAGE:-ghcr.io/jr-k/zotero-mcp:latest}"
    pull_policy: always
    init: true
    command:
      - serve
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TOKEN: "${MCP_TOKEN:?Set MCP_TOKEN in .env}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      # Keep the bearer token encrypted in transit with a TLS reverse proxy.
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8000}:8000"
    volumes:
      - zotero-mcp-data:/home/app/.config/zotero-mcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  zotero-mcp-data:
