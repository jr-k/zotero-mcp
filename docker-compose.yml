name: zotero-mcp-dev

services:
  zotero-mcp:
    build:
      context: .
      args:
        INSTALL_EXTRAS: all
    image: zotero-mcp:dev
    init: true
    command:
      - serve
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
    ports:
      - "${MCP_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      - zotero-mcp-dev-data:/home/app/.config/zotero-mcp

volumes:
  zotero-mcp-dev-data:
